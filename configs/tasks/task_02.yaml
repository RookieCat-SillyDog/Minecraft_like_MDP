condition: B
name: Alternative Routes
instruction: Reach the goal by the key-door route or the beef-cooking route.

initial_state: v0
terminal_states: [v5]

states:
  - id: v0
    label: Start
    position: [0, 2]
  - id: v1
    label: Key acquired
    position: [1, 1]
  - id: v2
    label: Door opened
    position: [2, 1]
  - id: v3
    label: Beef acquired
    position: [1, 3]
  - id: v4
    label: Cooked
    position: [2, 3]
  - id: v5
    label: Goal
    position: [3, 2]

transitions:
  - from: v0
    match: [GET_KEY]
    to: v1
    reward: 0
  - from: v1
    match: [OPEN_DOOR]
    to: v2
    reward: 0
  - from: v2
    match: [REACH_GOAL]
    to: v5
    reward: 1
  - from: v0
    match: [GET_BEEF]
    to: v3
    reward: 0
  - from: v3
    match: [COOK]
    to: v4
    reward: 0
  - from: v4
    match: [REACH_GOAL]
    to: v5
    reward: 1
