condition: B
name: Alternative Routes
instruction: Reach the goal by the key-door route or the beef-cooking route.

initial_state: v0
terminal_states: [v5]

states:
  - id: v0
    label: Start
    position: [0, 2]
  - id: v1
    label: Key acquired
    position: [1, 1]
  - id: v2
    label: Door opened
    position: [2, 1]
  - id: v3
    label: Beef acquired
    position: [1, 3]
  - id: v4
    label: Cooked
    position: [2, 3]
  - id: v5
    label: Goal
    position: [3, 2]

transitions:
  - from: v0
    event: GET_KEY
    to: v1
  - from: v1
    event: OPEN_DOOR
    to: v2
  - from: v2
    event: REACH_GOAL
    to: v5
  - from: v0
    event: GET_BEEF
    to: v3
  - from: v3
    event: COOK
    to: v4
  - from: v4
    event: REACH_GOAL
    to: v5
