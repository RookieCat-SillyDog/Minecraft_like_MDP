    match: [sugarcane]
    to: v1
    reward: 0
  - from: v0
    match: [rabbit]
    to: v3
    reward: 0
  - from: v1
    match: [workbench]
    to: v2
    reward: 0
  - from: v2
    match: [rabbit]
    to: v5
    reward: 0
  - from: v3
    match: [workbench]
    to: v4
    reward: 0
  - from: v4
    match: [sugarcane]
    to: v5
    reward: 0
  - from: v5
    match: [workbench]
    to: v6
    reward: 0
  - from: v6
    match: [table]
    to: v7
    reward: 1
