name: HRM CraftWorld Book
description: >-
  先做纸（甘蔗→工作台）或皮革（兔子→工作台），两者任意顺序，
  最后到桌子合成书；进入终止状态奖励 1，其余 0。
initial_state: v0
terminal_states: [v7]
transitions:
